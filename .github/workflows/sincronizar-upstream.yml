# Mantém o main do fork igual ao main do original (MatheusLarcher/agent-code).
# Roda todo dia e também pode ser disparado à mão na aba Actions.
name: Sincronizar com o original

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar main a partir do upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/merge-upstream" -f branch=main
